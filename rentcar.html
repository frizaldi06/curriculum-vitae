<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitsuki Car Rent</title>
    <style>
        /* --- CSS STYLING --- */
        :root {
            --primary: #007bff;
            --dark: #212529;
            --light: #f8f9fa;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        header {
            background-color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 { color: var(--primary); }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Carousel Section */
        .carousel-container {
            position: relative;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }
        .carousel-slides {
            display: none;
            padding: 40px;
            text-align: center;
        }
        .carousel-slides.active {
            display: block;
        }
        .car-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            object-fit: contain;
            margin-bottom: 20px;
        }
        .car-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .car-price {
            font-size: 20px;
            color: #28a745;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        /* Carousel Controls */
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 24px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .prev:hover, .next:hover { background: rgba(0,0,0,0.8); }
        .prev { left: 10px; }
        .next { right: 10px; }

        /* Button & Form Section */
        .cta-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .btn-book {
            background-color: var(--primary);
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
        .btn-book:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Form Styling */
        .form-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-section h3 {
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn-submit {
            background-color: var(--dark);
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-submit:hover { background-color: #111; }
    </style>

</head>
<body>

    <header>
        <h1>Mitsuki Car Rent</h1>
        <p>Easiest and Fastest Car Rental Service in Malaysia!</p>
    </header>

    <div class="container">
        <!-- Carousel Section -->
        <div class="carousel-container">
            <!-- Mobil 1 -->
            <div class="carousel-slides active">
                <img src="https://www.perodua.com.my/img.php?a=car/myvi/webp/myvi_infobox_img/myvi_info_box_kv_m_1_5x.webp&w=640&v=2" alt="Perodua Myvi" class="car-image">
                <div class="car-title">Perodua Myvi (Hatchback)</div>
                <div class="car-price">RM 120 / day</div>
            </div>
            <!-- Mobil 2 -->
            <div class="carousel-slides">
                <img src="https://protonpj.my/cdn-cgi/image/quality=80,width=1920,format=auto/https://carbase.my/upload/51/64/978/exterior/1762216748-4557.jpg" alt="Proton Saga" class="car-image">
                <div class="car-title">Proton Saga (Sedan)</div>
                <div class="car-price">RM 110 / day</div>
            </div>
            <!-- Mobil 3 -->
            <div class="carousel-slides">
                <img src="https://imgcdn.zigwheels.my/large/gallery/color/18/1527/perodua-alza-2018-color-838234.jpg" alt="Perodua Alza" class="car-image">
                <div class="car-title">Perodua Alza (MPV 7-Seater)</div>
                <div class="car-price">RM 180 / day</div>
            </div>

            <!-- Tombol Navigasi -->
            <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
            <button class="next" onclick="changeSlide(1)">&#10095;</button>
        </div>

        <!-- Tombol Book Now -->
        <div class="cta-container">
            <a href="#inquiry-form" class="btn-book">BOOK NOW</a>
        </div>

        <!-- Inquiry Form -->
        <div id="inquiry-form" class="form-section">
            <h3>Inquiry and Booking form</h3>
            <form onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" required placeholder="Masukkan nama Anda">
                </div>
                <div class="form-group">
                    <label for="car-select">Select car</label>
                    <select id="car-select" required>
                        <option value="Perodua Myvi">Perodua Myvi (RM 120/day)</option>
                        <option value="Proton Saga">Proton Saga (RM 110/day)</option>
                        <option value="Perodua Alza">Perodua Alza (RM 180/day)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="duration">Rental duration (day)</label>
                    <input type="number" id="duration" min="1" required placeholder="Example: 3">
                </div>
                <div class="form-group">
                    <label for="message">Message/Additional inquiry</label>
                    <textarea id="message" rows="4" placeholder="Write your pickup location or your question..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Inquiry</button>
            </form>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-slides');

        function changeSlide(direction) {
            // Sembunyikan slide aktif saat ini
            slides[currentSlide].classList.remove('active');
            
            // Hitung index slide berikutnya
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            
            // Tampilkan slide yang baru
            slides[currentSlide].classList.add('active');
            
            // Otomatis sinkronkan pilihan mobil di form saat slide berubah
            syncFormSelection();
        }

        function syncFormSelection() {
            const carTitles = ["Perodua Myvi", "Proton Saga", "Perodua Alza"];
            document.getElementById('car-select').value = carTitles[currentSlide];
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const car = document.getElementById('car-select').value;
            const duration = document.getElementById('duration').value;
            
            alert(`Thank you, ${name}! Your inquiry on ${car} car rent for ${duration} day has been received! We will contacting you soon.`);
            event.target.reset();
        }
    </script>
</body>
</html>
